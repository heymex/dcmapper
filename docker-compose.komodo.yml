# Production/Komodo deployment (Traefik + GHCR image). Copy to compose.yaml in Komodo stack dir.
#
# SECURITY: Always pin to an immutable image reference for production deployments.
# Use one of the following methods (in order of security preference):
#
# 1. Digest pinning (most secure - immutable):
#    DCMAPPER_IMAGE_TAG=sha-abc123@sha256:def456...
#
# 2. SHA-based tag (immutable):
#    DCMAPPER_IMAGE_TAG=sha-abc123
#
# 3. Semantic version tag (mutable - not recommended for production):
#    DCMAPPER_IMAGE_TAG=v1.0.0
#
# Find available SHA tags and digests at:
# https://github.com/heymex/dcmapper/pkgs/container/dcmapper
#
# DCMAPPER_IMAGE_TAG is REQUIRED and has no default to prevent accidental use of mutable tags.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dcmapper
      POSTGRES_USER: dcmapper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dcmapper}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcmapper -d dcmapper"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    labels:
      komodo.managed: "true"

  web:
    image: ghcr.io/heymex/dcmapper:${DCMAPPER_IMAGE_TAG:?DCMAPPER_IMAGE_TAG must be set to an immutable image reference (sha-* tag or digest). See comments above for details.}
    container_name: dcmapper-roch-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://dcmapper:${POSTGRES_PASSWORD:-dcmapper}@db:5432/dcmapper
      DCMAPPER_ADMIN_NAME: ${DCMAPPER_ADMIN_NAME:-admin}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://dcmapper-roch.vdolan.com}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-120}
      DCMAPPER_AUTO_CREATE_SCHEMA: ${DCMAPPER_AUTO_CREATE_SCHEMA:-false}
    networks:
      - internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.dcmapper-roch.rule=Host(`${DCMAPPER_DOMAIN:?set DCMAPPER_DOMAIN in .env}`)"
      - "traefik.http.routers.dcmapper-roch.entrypoints=websecure"
      - "traefik.http.routers.dcmapper-roch.tls.certresolver=${DCMAPPER_CERT_RESOLVER:-cf}"
      - "traefik.http.services.dcmapper-roch.loadbalancer.server.port=8000"
      - "komodo.managed=true"

volumes:
  pgdata:

networks:
  internal:
  proxy:
    external: true
    name: proxy
